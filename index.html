.nala-row::after{content:"";position:absolute;left:26px;bottom:-13px;border-left:13px solid transparent;border-right:13px solid transparent;border-top:14px solid var(--gold)}

.mg-piece{position:absolute;display:grid;place-items:center;font-size:28px;cursor:grab;background:linear-gradient(#fffdf6,#f0e2c4);border:2px solid var(--gold);border-radius:13px;box-shadow:0 5px 14px rgba(0,0,0,.3)}

canvas{display:block;margin:0 auto 13px;position:relative}
.narr-report{background:rgba(255,255,255,.72);border-left:5px solid var(--gold);padding:12px 15px;border-radius:10px;font-size:14.5px;line-height:1.55;margin-bottom:13px;position:relative}
.conf{font-size:12px;color:#9a7b3e;margin-top:6px}
.trend{background:rgba(255,244,221,.85);border:1px solid #eccf8e;border-radius:12px;padding:13px 15px;margin-bottom:13px;position:relative}
.trend h3{color:var(--terra);font-size:15.5px;margin-bottom:5px}.trend ul{margin:6px 0 0 18px;font-size:13.5px}.trend .src{font-size:11px;color:#a98a55;margin-top:6px}
.p3{font-size:13px;color:var(--teal-l);text-align:center;margin-bottom:13px;font-weight:700;position:relative}
.again{display:block;margin:6px auto 0;font:inherit;font-weight:800;font-size:16px;color:#fff;background:var(--teal-l);border:none;border-radius:30px;padding:13px 34px;cursor:pointer;position:relative}
.print{display:block;margin:10px auto 0;background:none;border:none;color:#9a7b3e;font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;position:relative}
@media print{#sound,#boat{display:none}body{overflow:visible;background:#fff}#game{position:static;background:#fff!important}#game::after{display:none}.scroll{max-height:none;background:var(--cream)!important}}

<body>
<button id="sound" aria-label="Suara">🔊</button>

<div id="game"></div>
<script>
/* ============================================================
   TENUN NUSANTARA — AI Agent Gamifikasi Naratif + Stealth Assessment
   Satu file, tanpa build. Slot LLM ada di nalaNarrate().
   ============================================================ */
const A={boy:"assets/char_boy.png",girl:"assets/char_girl.png",nalaDefault:"assets/nala-default.png",nalaHappy:"assets/nala-happy.png",nalaThinking:"assets/nala-thinking.png",
  boat:"assets/wooder-boat.png",tenun:"assets/5-magical-tenun.png",scroll:"assets/ancient-parchment-scroll.png",
  village:"assets/indonesia-village.png",market:"assets/floating-market.png",rainforest:"assets/tropical-rainforest.png",library:"assets/library-magical.png",peak:"assets/nusantara-peak-mountain.png",appLogo:"assets/logo_app.png"};
const SCENES={candi:{img:A.village,c:["#7a5a3a","#3a2a18"]},terapung:{img:A.market,c:["#b5613f","#5e2f1d"]},rimba:{img:A.rainforest,c:["#2f6e57","#13352a"]},
  harmoni:{img:A.village,c:["#caa23f","#6e5418"]},aksara:{img:A.library,c:["#5a4a8e","#2a2046"]},puncak:{img:A.peak,c:["#5a4632","#241a10"]},hub:{img:null,c:["#15525e","#0e2a30"]}};

/* ---------- suara ---------- */
let soundOn=true,actx=null,blipT=null; const $=id=>document.getElementById(id);
function beep(f,d,t){if(!soundOn)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type=t||"sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,actx.currentTime);g.gain.exponentialRampToValueAtTime(.16,actx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){}}
const sfxClick=()=>beep(520,.09,"triangle"), sfxGood=()=>{beep(660,.1);setTimeout(()=>beep(880,.13),85);}, sfxWhoosh=()=>beep(180,.25,"sawtooth"), sfxBad=()=>beep(160,.16,"sawtooth");
$("sound").onclick=()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"🔊":"";if(soundOn)beep(600,.08);};
function sailBoat(){const b=$("boat");b.classList.remove("sail");void b.offsetWidth;b.classList.add("sail");}
function typeWriter(n,t,done){clearInterval(blipT);n.textContent="";let i=0;blipT=setInterval(()=>{n.textContent+=t[i++];if(i%2===0)beep(420+Math.random()*120,.02,"square");if(i>=t.length){clearInterval(blipT);done&&done();}},24);}

/* ---------- dimensi bakat & P3 ---------- */
const DIM=["logika","sosial","seni","bahasa","alam","refleksi"];
const DL={logika:"Logika-Matematika",sosial:"Sosial-Interpersonal",seni:"Seni-Kreatif",bahasa:"Linguistik-Bahasa",alam:"Naturalis-Alam",refleksi:"Intrapersonal-Reflektif"};
const DC={logika:"#1f6e7e",sosial:"#c0613f",seni:"#d9a441",bahasa:"#6a8e3f",alam:"#3f8e7e",refleksi:"#8e6aa0"};
const P3={logika:"Bernalar Kritis",sosial:"Gotong Royong",seni:"Kreatif",bahasa:"Berkebinekaan Global",alam:"Berakhlak pada Alam",refleksi:"Mandiri"};
const TRENDS={logika:["Data & AI (skill tumbuh tercepat)","Cybersecurity","Pemrograman (Scratch → Python)"],
  sosial:["Kepemimpinan & pengaruh sosial","Pendidikan & kesehatan","Manajemen komunitas"],
  seni:["Desain produk & UX","Konten kreatif & animasi","Creative thinking (skill inti 2030)"],
  bahasa:["Komunikasi & storytelling","Pendidikan & media","Penulisan konten"],
  alam:["Green jobs & energi terbarukan","Pertanian cerdas","Konservasi lingkungan"],
  refleksi:["Psikologi & konseling","Penelitian","Entrepreneurship"]};

/* ---------- mesin AI Agent (stealth assessment + adaptif) ---------- */
const AI={ raw:[], signals:{}, conf:{} };
DIM.forEach(d=>{AI.signals[d]=[];AI.conf[d]=0;});
function recordSignal(dim,weight,meta){ if(!DIM.includes(dim))return; AI.raw.push({dim,weight,meta,t:Date.now()}); AI.signals[dim].push(weight); recomputeConf(); }
function recomputeConf(){ DIM.forEach(d=>{ const s=AI.signals[d]; if(!s.length){AI.conf[d]=0;return;}
  const sum=s.reduce((a,b)=>a+b,0); const islands=new Set(AI.raw.filter(r=>r.dim===d).map(r=>r.meta&&r.meta.island)).size;
  // confidence naik oleh total sinyal DAN jumlah pulau berbeda (triangulasi)
  const base=Math.min(100, sum*7); const tri=Math.min(1,islands/2); AI.conf[d]=Math.round(base*(0.45+0.55*tri)); }); }
function topDims(){ return [...DIM].sort((a,b)=>AI.conf[b]-AI.conf[a]); }
function dominantDim(){ return topDims()[0]; }
function playStyle(){ const fast=AI.raw.filter(r=>r.meta&&r.meta.speed==="fast").length, slow=AI.raw.filter(r=>r.meta&&r.meta.speed==="slow").length, help=AI.raw.filter(r=>r.meta&&r.meta.help).length, acc=AI.raw.filter(r=>r.meta&&r.meta.accuracy!=null);
  const avgAcc=acc.length?acc.reduce((a,r)=>a+r.meta.accuracy,0)/acc.length:null;
  return {fast,slow,help,avgAcc, decisive:fast>slow+1, cautious:slow>fast+1, collaborative:help>=2, precise:avgAcc!=null&&avgAcc>=0.8}; }

/* SLOT LLM: ganti isi fungsi ini dengan fetch ke Gemini/OpenAI di produksi.
   Jika gagal/offline, pakai fallback lokal supaya demo tetap jalan. */
async function nalaNarrate(ctx){ try{
  /* --- AKTIFKAN DI PRODUKSI (contoh Gemini) ---
  const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key="+GEMINI_KEY,
    {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:ctx.prompt}]}]})});
  const j=await r.json(); return j.candidates[0].content.parts[0].text;
  */
  return null; // null → pakai fallback lokal
}catch(e){return null;}}
function localNarrative(){ const d=dominantDim(), ps=playStyle(), name=playerName;
  const cara=ps.decisive?"cepat dan yakin mengambil keputusan":ps.cautious?"berhati-hati dan menimbang matang-matang":"menyeimbangkan kecepatan dan kehati-hatian";
  const kolab=ps.collaborative?" Kamu juga tidak ragu meminta bantuan — tanda kerendahan hati.":"";
  const presisi=ps.precise?" Akurasimu dalam tantangan sangat tinggi — kamu teliti.":"";
  return `<b>${name}</b>, kamu paling bersinar pada <b>${DL[d]}</b>. Sepanjang petualangan kamu ${cara}.${kolab}${presisi} Di Puncak Tenun, kamu memimpin dengan gaya <b>${finaleLeadLabel()}</b>. 🌟`; }

/* ---------- data pulau ---------- */
const ISLANDS=[{id:"candi",em:"🛕",fokus:"logika"},{id:"terapung",em:"🛶",fokus:"sosial"},{id:"rimba",em:"🌿",fokus:"alam"},{id:"harmoni",em:"🎶",fokus:"seni"},{id:"aksara",em:"📜",fokus:"bahasa"}];
const ACT1={
 candi:{t:"Kabut menyelimuti candi kuno. Reliefnya runtuh, polanya hilang.",n:"Relief ini seperti teka-teki. Mau mulai dari mana?",c:[["🧩","Cocokkan pola ukiran yang tersisa","logika",3],["💬","Ajak penjaga candi bercerita","bahasa",2],["🎨","Gambar ulang motifnya","seni",2]]},
 terapung:{t:"Perahumu merapat di Pasar Terapung. Pedagang kesal, warga berebut tempat.",n:"Ramai sekali! Apa yang pertama kamu lakukan?",c:[["🤝","Ajak warga duduk mencari solusi","sosial",3],["🧮","Atur ulang tempat agar adil","logika",3],["🎨","Hibur pedagang dengan lagu","seni",2]]},
 rimba:{t:"Hutan hujan menyambutmu. Ada jejak aneh dan tanaman asing.",n:"Petualang sejati mengamati dulu. Apa yang kamu lakukan?",c:[["🐾","Ikuti & cocokkan jejak satwa","alam",3],["✏️","Catat & gambar bentuk daun","seni",2],["👂","Dengarkan suara hutan","alam",3]]},
 harmoni:{t:"Desa di kaki gunung sunyi. Gamelan kehilangan nada.",n:"Sunyi yang sedih. Mulai dari mana?",c:[["🎵","Dengar & tiru nada yang tersisa","seni",3],["🧮","Hitung ketukan agar pas","logika",2],["🤝","Ajak anak desa bernyanyi","sosial",2]]},
 aksara:{t:"Perpustakaan kuno di atas beringin. Gerbang terkunci mantra aksara.",n:"Aksaranya indah tapi asing. Mulai bagaimana?",c:[["🔤","Cocokkan aksara dengan gambar","bahasa",3],["🧩","Cari pola berulang seperti kode","logika",3],["🗣️","Baca keras untuk dengar iramanya","bahasa",3]]}};
const ACT3={
 candi:{t:"Stupa selamat! Runtuhan menimpa dua sisi: relief pusaka, dan tiga pekerja terjebak.",n:"Pilihan sulit… tidak ada yang salah.",c:[["❤️","Selamatkan tiga pekerja dulu","sosial",6],["🏺","Amankan relief pusaka","logika",5],["💡","Carikan cara menyangga keduanya","logika",5]]},
 terapung:{t:"Jembatan selamat! Perahu muat sekali lagi. Kiri: harta kakek. Kanan: tiga keluarga terjebak.",n:"Hatimu memilih?",c:[["❤️","Selamatkan tiga keluarga dulu","sosial",6],["📦","Ambil harta kakek","refleksi",6],["💡","Ikat peti agar dua-duanya terbawa","logika",5]]},
 rimba:{t:"Burung sembuh! Penduduk ingin tebang pohon ini. Sarang ada di atasnya.",n:"Pohon atau sarang?",c:[["🌳","Lindungi sarang, cari bahan ganti","alam",6],["🪓","Izinkan tebang demi warga","sosial",5],["💡","Usulkan tanam pohon baru","alam",5]]},
 harmoni:{t:"Gunung tenang! Tetua memintamu tampil: solo, atau pimpin paduan suara desa.",n:"Panggung menanti. Pilihanmu?",c:[["🎼","Pimpin paduan suara seluruh desa","sosial",6],["🌟","Tampil solo dengan karyamu","seni",6],["🍃","Padukan suara alam ke musik","alam",5]]},
 aksara:{t:"Gerbang terbuka! Kitab ilmu luar biasa. Simpan untukmu, atau sebarkan?",n:"Keputusanmu?",c:[["🌍","Sebarkan agar semua pintar","sosial",6],["📖","Pelajari sendiri dulu","refleksi",6],["🖋️","Salin & terjemahkan agar mudah","bahasa",5]]}};

/* ---------- layar awal ---------- */

  $("gi").onclick=()=>{playerName=$("ni").value.trim()||"Petualang";sfxGood();introNala();};}
async function introNala(){setBackground("hub");sailBoat();game.innerHTML=`<div class="inner"></div>`;const inner=game.querySelector(".inner");

/* ---------- alur pulau ---------- */
function startIsland(i){curIsland=i;sailBoat();setTimeout(playAct1,300);}
function speedTag(){const dt=(Date.now()-actStart)/1000;return dt<1.3?"fast":dt>6?"slow":"mid";}
function playAct1(){const isl=ISLANDS[curIsland],a=ACT1[isl.id];setBackground(isl.id);sfxWhoosh();
  game.innerHTML=`<div class="inner"><div class="scene-em">${isl.em}</div><div class="narr" id="nr"></div><div class="choices" id="cc"></div></div>`;
  typeWriter($("nr"),a.t,()=>{const cc=$("cc");a.c.forEach(ch=>{const b=document.createElement("button");b.className="choice";b.innerHTML=`${ch[0]}&nbsp; ${ch[1]}`;b.onclick=()=>{sfxGood();recordSignal(ch[2],ch[3],{island:isl.id,phase:1,speed:speedTag()});setTimeout(runMinigames,230);};cc.appendChild(b);});
    cc.appendChild(hintBtn());game.querySelector(".inner").appendChild(nalaRow("<b>NALA:</b> "+a.n,"thinking"));});actStart=Date.now();}
function hintBtn(){const h=document.createElement("button");h.className="choice gold";h.style.fontSize="14px";h.style.padding="10px";h.textContent="💡 NALA, aku bingung...";h.onclick=()=>{recordSignal(dominantDim(),0,{help:true});sfxClick();h.textContent=`💡 Ikuti yang terasa alami, ${N()} — itu justru datanya!`;h.disabled=true;};return h;}

/* jalankan 2 mini-game pulau secara berurutan */
let mgQueue=[];
function runMinigames(){ mgQueue=[...ISLAND_MG[ISLANDS[curIsland].id]].sort(()=>Math.random()-.5); nextMG(); }
function nextMG(){ if(!mgQueue.length){ afterMG(); return; } const key=mgQueue.shift(); launchMG(key); }
function afterMG(){ /* adaptive: kalau performa bagus, babak 3 beri sinyal bonus kecil */ setTimeout(playAct3,250); }

/* ---------- launcher mini-game ---------- */
function launchMG(key){const m=MG[key],isl=ISLANDS[curIsland];setBackground(isl.id);sfxWhoosh();actStart=Date.now();
  game.innerHTML=`<div class="inner"><div class="scene-em">${m.em}</div><div class="narr" id="nr"></div>
    <div class="mg-hud"><span class="mg-timer" id="mt">⏳ --</span><span id="mp"></span><span class="bar-mini"><i id="mb" style="width:0"></i></span></div>
    <div class="mg-area" id="ma"></div><div class="mg-feedback" id="mf"></div></div>`;
  typeWriter($("nr"),m.q);
  const finish=(accuracy)=>{clearTmr();const ok=accuracy>=0.5;sfxGood();
    recordSignal(m.dim, 4+Math.round(accuracy*4), {island:isl.id,phase:2,game:key,accuracy,speed:speedTag()});
    $("mf").textContent=ok?"✨ Hebat! Tantangan selesai!":"Waktu habis — usaha kamu tetap terhitung, kok!";
    setTimeout(nextMG,850);};
  if(m.time>0){let left=m.time+adaptiveBonus;const tEl=$("mt");const tick=()=>{tEl.textContent="⏳ "+left+"s";if(left<=5)tEl.style.color="#ffd9a0";left--;if(left<0)finish(0);};tick();mgTimer=setInterval(tick,1000);}
  ({drag:buildDrag,tap:buildTap,brew:buildBrew,rhythm:buildRhythm,memory:buildMemory,trace:buildTrace,balance:buildBalance}[m.type])(m,finish);
}
function setProg(t){const e=$("mp");if(e)e.textContent=t;} function setBar(p){const e=$("mb");if(e)e.style.width=Math.max(0,Math.min(100,p))+"%";}

/* --- drag (relief/aksara) --- */
function buildDrag(m,finish){const ma=$("ma"),W=ma.clientWidth,H=ma.clientHeight,sw=Math.min(92,W/m.items.length-8);const slots=[],placed=Array(m.items.length).fill(false);
  m.items.forEach((_,i)=>{const s=document.createElement("div");s.className="mg-slot";s.style.width=s.style.height=sw+"px";s.style.left=(6+i*(sw+6))+"px";s.style.top=(H/2-sw/2)+"px";s.textContent=i+1;ma.appendChild(s);slots.push(s);});
  const tray=document.createElement("div");tray.className="mg-tray";ma.appendChild(tray);
  [...m.items.keys()].sort(()=>Math.random()-.5).forEach(idx=>{const p=document.createElement("div");p.className="mg-piece";p.style.width=p.style.height=sw+"px";p.textContent=m.items[idx];p.dataset.idx=idx;tray.appendChild(p);mkDrag(p,slots,idx,placed,m,finish);});setProg("0/"+m.items.length);}
function mkDrag(pc,slots,idx,placed,m,finish){let sx,sy,ox,oy,dr=false;
  const dn=e=>{dr=true;pc.classList.add("drag");const t=e.touches?e.touches[0]:e;sx=t.clientX;sy=t.clientY;const r=pc.getBoundingClientRect(),ar=pc.parentElement.getBoundingClientRect();ox=r.left-ar.left;oy=r.top-ar.top;pc.style.position="absolute";pc.style.left=ox+"px";pc.style.top=oy+"px";e.preventDefault();};
  const mv=e=>{if(!dr)return;const t=e.touches?e.touches[0]:e;pc.style.left=(ox+t.clientX-sx)+"px";pc.style.top=(oy+t.clientY-sy)+"px";e.preventDefault();};
  const up=e=>{if(!dr)return;dr=false;pc.classList.remove("drag");const pr=pc.getBoundingClientRect();let hit=-1;
    slots.forEach((s,i)=>{const sr=s.getBoundingClientRect();if(!placed[i]&&Math.abs(pr.left+pr.width/2-(sr.left+sr.width/2))<sr.width/2&&Math.abs(pr.top+pr.height/2-(sr.top+sr.height/2))<sr.height/2)hit=i;});
    if(hit===idx){placed[idx]=true;pc.style.pointerEvents="none";const s=slots[idx];s.textContent=m.items[idx];s.classList.add("filled");s.appendChild(pc);pc.style.position="static";sfxGood();const d=placed.filter(Boolean).length;setProg(d+"/"+m.items.length);setBar(d/m.items.length*100);if(d===m.items.length)finish(1);}
    else{sfxBad();pc.style.position="static";pc.style.left="auto";pc.style.top="auto";}e.preventDefault();};
  pc.addEventListener("mousedown",dn);pc.addEventListener("touchstart",dn,{passive:false});window.addEventListener("mousemove",mv);window.addEventListener("touchmove",mv,{passive:false});window.addEventListener("mouseup",up);window.addEventListener("touchend",up);}

/* --- tap (evakuasi/panen) --- */
function buildTap(m,finish){const ma=$("ma");let hits=0,total=m.items.length,idx=0;
  function spawn(){if(idx>=total){finish(hits/total);return;}const it=m.items[idx++];const good=Array.isArray(it)?it[1]:1;const em=Array.isArray(it)?it[0]:it;
    const t=document.createElement("div");t.className="mg-target";t.style.width=t.style.height="62px";t.style.left=Math.random()*(ma.clientWidth-62)+"px";t.style.top=Math.random()*(ma.clientHeight-82)+"px";t.textContent=em;
    t.onclick=()=>{if(good){hits++;sfxGood();t.classList.add("done");}else{sfxBad();t.style.opacity=.3;}setProg(hits+" benar");setBar(idx/total*100);setTimeout(()=>{t.remove();spawn();},150);};
    ma.appendChild(t);} spawn();}

/* --- brew (jamu) --- */
function buildBrew(m,finish){const ma=$("ma");const ca=document.createElement("div");ca.className="mg-cauldron";ca.textContent="🍲";ma.appendChild(ca);
  const all=[...m.good,...m.bad].sort(()=>Math.random()-.5);let g=0,b=0;const tray=document.createElement("div");tray.className="mg-tray";ma.appendChild(tray);
  all.forEach(em=>{const p=document.createElement("div");p.className="mg-piece";p.style.width=p.style.height="56px";p.style.position="relative";p.textContent=em;tray.appendChild(p);
    mkDragTo(p,ca,()=>{if(m.good.includes(em)){g++;sfxGood();}else{b++;sfxBad();}p.remove();setProg("🌿"+g+" ✖"+b);setBar((g+b)/all.length*100);if(g>=m.good.length)finish(b===0?1:0.5);else if(g+b>=all.length)finish(g>=m.good.length&&b===0?1:0.4);});});setProg("🌿0 0");}
function mkDragTo(pc,ca,drop){let sx,sy,ox,oy,dr=false,par=pc.parentElement;
  const dn=e=>{dr=true;pc.classList.add("drag");const t=e.touches?e.touches[0]:e;sx=t.clientX;sy=t.clientY;const r=pc.getBoundingClientRect(),ar=par.getBoundingClientRect();ox=r.left-ar.left;oy=r.top-ar.top;pc.style.position="absolute";pc.style.left=ox+"px";pc.style.top=oy+"px";e.preventDefault();};
  const mv=e=>{if(!dr)return;const t=e.touches?e.touches[0]:e;pc.style.left=(ox+t.clientX-sx)+"px";pc.style.top=(oy+t.clientY-sy)+"px";const pr=pc.getBoundingClientRect(),cr=ca.getBoundingClientRect();ca.classList.toggle("over",Math.hypot(pr.left+pr.width/2-(cr.left+cr.width/2),pr.top+pr.height/2-(cr.top+cr.height/2))<cr.width/2);e.preventDefault();};
  const up=e=>{if(!dr)return;dr=false;pc.classList.remove("drag");ca.classList.remove("over");const pr=pc.getBoundingClientRect(),cr=ca.getBoundingClientRect();if(Math.hypot(pr.left+pr.width/2-(cr.left+cr.width/2),pr.top+pr.height/2-(cr.top+cr.height/2))<cr.width/2)drop();else{pc.style.position="relative";pc.style.left="auto";pc.style.top="auto";}e.preventDefault();};
  pc.addEventListener("mousedown",dn);pc.addEventListener("touchstart",dn,{passive:false});window.addEventListener("mousemove",mv);window.addEventListener("touchmove",mv,{passive:false});window.addEventListener("mouseup",up);window.addEventListener("touchend",up);}

/* --- rhythm (gamelan/pantun) --- */
function buildRhythm(m,finish){const ma=$("ma");ma.style.display="flex";ma.style.alignItems="center";ma.style.justifyContent="center";ma.style.background="transparent";ma.style.border="none";
  const w=document.createElement("div");w.className="mg-pad";ma.appendChild(w);let step=0,hits=0;setProg("0/"+m.seq.length);
  const keys=m.keys.map((k,i)=>{const b=document.createElement("button");b.className="mg-key";b.textContent=k;w.appendChild(b);
    b.onclick=()=>{const want=m.seq[step];if(i===want){sfxGood();hits++;b.classList.add("lit");setTimeout(()=>b.classList.remove("lit"),140);step++;setProg(step+"/"+m.seq.length);setBar(step/m.seq.length*100);setTimeout(showNext,240);}else{sfxBad();b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),180);}};return b;});
  function showNext(){if(step>=m.seq.length){finish(hits/m.seq.length);return;}const i=m.seq[step];keys[i].classList.add("lit");beep(440+i*110,.2);setTimeout(()=>keys[i].classList.remove("lit"),400);}
  setTimeout(showNext,650);}

/* --- memory (pasangan) --- */
function buildMemory(m,finish){const ma=$("ma");ma.style.display="grid";ma.style.gridTemplateColumns="repeat(4,1fr)";ma.style.gap="8px";ma.style.padding="14px";ma.style.alignContent="center";ma.style.background="rgba(255,255,255,.1)";
  const deck=[...m.pairs,...m.pairs].map((e,i)=>({e,i})).sort(()=>Math.random()-.5);let first=null,lock=false,matched=0;
  deck.forEach(o=>{const c=document.createElement("div");c.className="mg-key";c.style.width=c.style.height="64px";c.style.fontSize="26px";c.textContent="?";c.dataset.e=o.e;
    c.onclick=()=>{if(lock||c===first||c.classList.contains("done"))return;sfxClick();c.textContent=c.dataset.e;c.classList.add("lit");
      if(!first){first=c;}else{if(first.dataset.e===c.dataset.e){sfxGood();first.classList.add("done");c.classList.add("done");first=null;matched++;setProg(matched+"/"+m.pairs.length);setBar(matched/m.pairs.length*100);if(matched===m.pairs.length)finish(1);}
      else{lock=true;sfxBad();const a=first,b=c;setTimeout(()=>{a.textContent="?";a.classList.remove("lit");b.textContent="?";b.classList.remove("lit");first=null;lock=false;},650);}}};ma.appendChild(c);});}

/* --- trace (batik) --- */
function buildTrace(m,finish){const ma=$("ma");const cv=document.createElement("canvas");cv.width=ma.clientWidth||500;cv.height=280;cv.style.width="100%";cv.style.height="280px";cv.style.touchAction="none";ma.appendChild(cv);ma.style.border="none";ma.style.background="rgba(255,255,255,.9)";
  const ctx=cv.getContext("2d"),W=cv.width,H=cv.height;const pts=[];for(let i=0;i<=40;i++){pts.push({x:i/40*W,y:H/2+Math.sin(i/3)*60});}
  ctx.strokeStyle="#d8c39a";ctx.lineWidth=26;ctx.lineCap="round";ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();
  ctx.strokeStyle="#1f6e7e";ctx.lineWidth=4;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();
  let onPath=0,total=0,pi=0,drawing=false;
  function pos(e){const r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height};}
  function near(p){let best=1e9;pts.forEach(q=>best=Math.min(best,Math.hypot(p.x-q.x,p.y-q.y)));return best<24;}
  const dn=e=>{drawing=true;const p=pos(e);total++;if(near(p))onPath++;e.preventDefault();};
  const mv=e=>{if(!drawing)return;const p=pos(e);total++;if(near(p))onPath++;setBar(total?onPath/total*100:0);e.preventDefault();};
  const up=e=>{drawing=false;if(total>15)finish(onPath/total);e.preventDefault();};
  cv.addEventListener("mousedown",dn);cv.addEventListener("touchstart",dn,{passive:false});cv.addEventListener("mousemove",mv);cv.addEventListener("touchmove",mv,{passive:false});cv.addEventListener("mouseup",up);cv.addEventListener("touchend",up);
  setProg("Telusuri garis birunya!");}

/* --- balance (timbangan) --- */
function buildBalance(m,finish){const ma=$("ma");ma.style.display="flex";ma.style.flexDirection="column";ma.style.alignItems="center";ma.style.justifyContent="center";ma.style.gap="14px";ma.style.background="rgba(255,255,255,.1)";
  const info=document.createElement("div");info.style.cssText="color:#fff;font-weight:700;font-size:18px";info.textContent="Target: "+m.target;ma.appendChild(info);
  const pool=document.createElement("div");pool.className="mg-pad";ma.appendChild(pool);const chosen=[];
  const render=()=>{const sum=chosen.reduce((a,b)=>a+b,0);info.textContent="Target "+m.target+" · sekarang "+sum+(Math.abs(sum-m.target)<=1&&chosen.length?" ✅":"");
    if(chosen.length&&Math.abs(sum-m.target)<=1){finish(1);return;}};
  m.pool.forEach(v=>{const b=document.createElement("button");b.className="mg-key";b.style.width=b.style.height="58px";b.textContent=v;b.onclick=()=>{if(chosen.includes(v)){chosen.splice(chosen.indexOf(v),1);b.classList.remove("lit");}else{chosen.push(v);b.classList.add("lit");sfxClick();}render();};pool.appendChild(b);});render();}

  game.innerHTML=`<div class="inner"><div class="scene-em">${isl.em}</div><div class="narr" id="nr"></div><div class="choices" id="cc"></div></div>`;

    cc.appendChild(hintBtn());game.querySelector(".inner").appendChild(nalaRow("<b>NALA:</b> "+a.n,"thinking"));});actStart=Date.now();}
async function campfire(){const isl=ISLANDS[curIsland];setBackground("hub");sfxWhoosh();
  game.innerHTML=`<div class="inner"><div class="scene-em">🔥</div><div class="narr" id="nr"></div><div class="cf"><textarea id="cft" placeholder="Tulis perasaanmu... atau tekan 🎙️"></textarea><div class="row"><button class="mic" id="mic">🎙️</button><button class="btn start" id="cn" style="font-size:17px;padding:12px 28px">Lanjutkan →</button></div></div></div>`;
  typeWriter($("nr"),`${N()}, ${CFQ[isl.id]}`);
  const ta=$("cft"),mic=$("mic");let recog=null,rec=false;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){recog=new SR();recog.lang="id-ID";recog.interimResults=false;recog.onresult=e=>ta.value=(ta.value+" "+e.results[0][0].transcript).trim();recog.onend=()=>{rec=false;mic.classList.remove("rec");mic.textContent="🎙️";};}
  mic.onclick=()=>{if(!SR){alert("Browser belum mendukung suara. Ketik saja ya.");return;}if(rec)recog.stop();else try{recog.start();rec=true;mic.classList.add("rec");mic.textContent="⏹️";}catch(e){}};
  $("cn").onclick=async()=>{sfxClick();const v=ta.value.trim();if(v){recordSignal("refleksi",2,{island:isl.id,reflect:v});if(/takut|sedih|senang|bingung|kasihan|bangga|cemas|lega/i.test(v))recordSignal("refleksi",2,{});}
    // adaptive: refleksikan ke bonus waktu mini-game berikutnya
    adaptiveBonus = (AI.conf[dominantDim()]>60)? 3 : 0;
    if(curIsland<ISLANDS.length-1){curIsland++;setTimeout(()=>startIsland(curIsland),230);}else setTimeout(startFinale,230);};}

/* ---------- finale + laporan ---------- */
function startFinale(){setBackground("puncak");sailBoat();sfxWhoosh();setTimeout(()=>{
  game.innerHTML=`<div class="inner"><div class="scene-em">⛰️</div><div class="narr" id="nr"></div><div class="choices" id="cc"></div></div>`;
  typeWriter($("nr"),`${N()}, ${FINALE.t}`,()=>{const cc=$("cc");FINALE.c.forEach(ch=>{const b=document.createElement("button");b.className="choice";b.innerHTML=`${ch[0]}&nbsp; ${ch[1]}`;b.onclick=()=>{clearTmr();sfxGood();recordSignal(ch[3==3?2:2],ch[3],{phase:4});finaleLead=ch[4];recordSignal(ch[2],ch[3],{phase:4,lead:ch[4]});setTimeout(showReport,300);};cc.appendChild(b);});
    game.querySelector(".inner").appendChild(nalaRow("<b>NALA:</b> "+FINALE.n,"thinking"));});
  actStart=Date.now();let left=FINALE.time;timer=setInterval(()=>{left--;if(left<0){clearTmr();finaleLead=FINALE.c[0][4];recordSignal(FINALE.c[0][2],FINALE.c[0][3],{phase:4,lead:finaleLead});showReport();}},1000);
},300);}

async function showReport(){clearTmr();setBackground("hub");sfxGood();setTimeout(()=>beep(990,.18),120);
  const top=topDims(),d=top[0],conf=AI.conf[d],ps=playStyle();
  const p3=[...new Set([d,...top.filter(x=>AI.conf[x]>=Math.max(...top.map(t=>AI.conf[t]))*0.6)])].slice(0,3).map(x=>P3[x]).join(" · ");
  const custom=await nalaNarrate({prompt:`Ringkasan 2 kalimat untuk ${playerName}, bakat dominan ${DL[d]}, gaya main ${JSON.stringify(ps)}.`});
  game.innerHTML=`<div class="inner"><div class="scroll" id="sc"><h2>🧶 Gulungan Tenun ${N()}</h2><div class="sub">Lima benang telah kau tenun menjadi satu kain.</div><div class="threads" id="th"></div><canvas id="radar" width="300" height="280"></canvas><div class="narr-report" id="nrr"></div><div class="p3">✦ ${p3} ✦</div><div class="trend"><h3>🚀 Jalan yang cocok untukmu di era sekarang</h3><p>Karena kamu kuat di <b>${DL[d]}</b>, arah yang sedang tumbuh menuju 2030:</p><ul id="tl"></ul><div class="src">Sumber: World Economic Forum, Future of Jobs Report 2025 & kebutuhan 9 juta talenta digital Indonesia 2030.</div></div><button class="again" id="ag">↻ Main Lagi</button><button class="print" id="pr">Simpan PDF</button></div></div>`;
  $("sc").style.backgroundImage=`url('${A.scroll}')`;
  const th=$("th");ISLANDS.forEach(i=>{const x=document.createElement("div");x.className="th";x.style.background=DC[i.fokus];x.textContent=i.em;th.appendChild(x);});
  drawRadar($("radar"));
  $("nrr").innerHTML=(custom||localNarrative())+`<div class="conf">Tingkat keyakinan NALA: <b>${conf}%</b> ${conf<55?"— mainkan lagi agar makin akurat ✦":"— sinyal cukup konsisten ✦"}</div>`;
  TRENDS[d].forEach(a=>{const li=document.createElement("li");li.textContent=a;$("tl").appendChild(li);});
  $("ag").onclick=resetGame;$("pr").onclick=()=>window.print();}
function drawRadar(cv){const ctx=cv.getContext("2d"),cx=150,cy=135,R=98,n=DIM.length;const mx=Math.max(1,...DIM.map(d=>AI.conf[d]));
  for(let r=1;r<=4;r++){ctx.beginPath();for(let i=0;i<=n;i++){const a=Math.PI/2+i*2*Math.PI/n,rr=R*r/4;ctx[i?"lineTo":"moveTo"](cx+rr*Math.cos(a),cy-rr*Math.sin(a));}ctx.strokeStyle="#d8c39a";ctx.stroke();}
  for(let i=0;i<n;i++){const a=Math.PI/2+i*2*Math.PI/n;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+R*Math.cos(a),cy-R*Math.sin(a));ctx.strokeStyle="#d8c39a";ctx.stroke();}
  ctx.beginPath();DIM.forEach((d,i)=>{const a=Math.PI/2+i*2*Math.PI/n,r=R*AI.conf[d]/100;ctx[i?"lineTo":"moveTo"](cx+r*Math.cos(a),cy-r*Math.sin(a));});ctx.closePath();ctx.fillStyle="rgba(31,110,126,.28)";ctx.fill();ctx.strokeStyle="#1f6e7e";ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle="#5a4a28";ctx.font="bold 11px Trebuchet MS";ctx.textAlign="center";DIM.forEach((d,i)=>{const a=Math.PI/2+i*2*Math.PI/n,rr=R+18;ctx.fillText(DL[d].split("-")[0],cx+rr*Math.cos(a),cy-rr*Math.sin(a)+4);});}
function resetGame(){DIM.forEach(d=>{AI.signals[d]=[];AI.conf[d]=0;});AI.raw=[];finaleLead=null;adaptiveBonus=0;titleScreen();}

titleScreen();
</script>
