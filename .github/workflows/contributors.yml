name: All Contributors

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  contribute:
    if: contains(github.event.comment.body, '@all-contributors')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: All Contributors Action
        uses: all-contributors/all-contributors-bot@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
